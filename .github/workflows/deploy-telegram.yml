name: Build and Deploy

on:
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    name: Build Android & Deploy to Telegram
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Tests & Validation
        run: |
          npm run lint --if-present
          npm run test --if-present

      - name: Build Android Release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Locate APK & Get Metadata
        id: apk-info
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*arm64-v8a*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          
          # Extract version from package.json
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload APK as Pipeline Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.apk-info.outputs.apk_path }}
          retention-days: 7

      - name: Send APK to Telegram
        if: success()
        run: |
          APK_PATH="${{ steps.apk-info.outputs.apk_path }}"
          APP_NAME="BingoApp"
          VERSION="${{ steps.apk-info.outputs.version }}"
          COMMIT_SHA="${GITHUB_SHA::7}"
          BRANCH="${GITHUB_REF#refs/heads/}"
          
          CAPTION=$(cat <<EOF
          📱 $APP_NAME
          🏷 Version: $VERSION
          🔢 Build: $GITHUB_RUN_NUMBER
          🌿 Branch: $BRANCH
          🔗 Commit: $COMMIT_SHA
          ✅ Status: Built Successfully
          ⏰ Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          EOF
          )
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F chat_id="${{ secrets.TELEGRAM_CHANNEL_ID }}" \
            -F document=@"$APK_PATH" \
            -F caption="$CAPTION"

      - name: Send Success Summary to Telegram
        if: success()
        run: |
          VERSION="${{ steps.apk-info.outputs.version }}"
          COMMIT_SHA="${GITHUB_SHA::7}"
          
          MESSAGE=$(cat <<EOF
          Android build completed successfully 🚀
          Version: $VERSION
          Build: $GITHUB_RUN_NUMBER
          Commit: $COMMIT_SHA
          APK: attached
          EOF
          )
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHANNEL_ID }}" \
            -d text="$MESSAGE"

      - name: Send Failure Notification to Telegram
        if: failure()
        run: |
          COMMIT_SHA="${GITHUB_SHA::7}"
          BRANCH="${GITHUB_REF#refs/heads/}"
          
          MESSAGE=$(cat <<EOF
          ❌ Android build FAILED
          Branch: $BRANCH
          Commit: $COMMIT_SHA
          Run ID: $GITHUB_RUN_ID
          Check GitHub Actions for details.
          EOF
          )
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHANNEL_ID }}" \
            -d text="$MESSAGE"

